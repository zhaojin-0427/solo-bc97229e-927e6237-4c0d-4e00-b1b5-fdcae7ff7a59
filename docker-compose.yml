services:
  # 本地模拟岸站：持续生成船位，SSE 实时流 + 历史分页（可注入断流/翻页失败）
  station:
    build: .
    command: uvicorn shore_station.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      # 每 0.25 秒生成一条船位，启动即有 60 条历史
      GEN_INTERVAL: "0.25"
      INITIAL_COUNT: "60"
      HISTORY_PAGE_LIMIT: "100"
      # 初始历史接口正常；演练时通过 POST /station/history-fail-rate 调整
      HISTORY_FAIL_RATE: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 采集归档服务：FastAPI + SQLite，对接岸站 SSE 与历史接口，增量计算港区进出事件
  collector:
    build: .
    command: uvicorn collector.app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      STATION_URL: "http://station:8000"
      DB_PATH: "/data/collector.db"
      HISTORY_PAGE_SIZE: "50"
      SSE_READ_TIMEOUT: "60"
      # 港区固定经纬度矩形（部署配置）：边界算内部，不跨 180° 经线。
      # 覆盖模拟船圆周运动的内圈轨道，保证持续产生进/出港事件。
      PORT_LAT_MIN: "31.208"
      PORT_LAT_MAX: "31.252"
      PORT_LON_MIN: "121.448"
      PORT_LON_MAX: "121.492"
      # 事件引擎单批处理船位数（小批量提交，历史扫描不占长写事务）
      EVENT_BATCH_SIZE: "200"
      EVENT_IDLE_INTERVAL: "0.3"
    volumes:
      - collector-data:/data
    depends_on:
      station:
        condition: service_healthy

volumes:
  collector-data:
